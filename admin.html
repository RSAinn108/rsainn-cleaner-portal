<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSAinn Admin Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7f8;--card:#fff;--text:#172126;--muted:#6c7880;--line:#e3e8eb;--brand:#0b6b57;--brand2:#084d40;--danger:#b42318;--warn:#a15c00}
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px 20px;position:sticky;top:0;z-index:5}
.header-inner{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:800;font-size:22px}.brand span{color:var(--brand)} .sub{font-size:12px;color:var(--muted)}
main{max-width:1100px;margin:24px auto;padding:0 16px 50px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 3px 14px rgba(0,0,0,.04)}
h1,h2,h3{margin-top:0} h2{font-size:20px}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cfd7dc;border-radius:10px;font:inherit;background:#fff}
label{font-size:13px;font-weight:700;display:block;margin:10px 0 6px}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}
.primary{background:var(--brand);color:white}.primary:hover{background:var(--brand2)}
.secondary{background:#eef3f1;color:var(--brand2)}.danger{background:#fff0ef;color:var(--danger)}
.small{padding:8px 10px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{background:#e8eeec;color:#31423c}.tab.active{background:var(--brand);color:#fff}
.hidden{display:none!important}.status{padding:10px 12px;border-radius:10px;margin-top:12px;background:#eef7f4;color:#175b49}
.error{background:#fff0ef;color:#8d1b13}.row{border-top:1px solid var(--line);padding:14px 0}.row:first-child{border-top:0}
.rowtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#eef1f3}
.pill.manual{background:#eaf4ff;color:#175b9a}.pill.blocked{background:#fff4df;color:#8a5300}.pill.synced{background:#eaf7ef;color:#17633a}.pill.off{background:#fdeceb;color:#9a241c}
.linkbox{word-break:break-all;background:#f7f9fa;padding:10px;border-radius:9px;font-size:12px;margin-top:8px}
.login{max-width:440px;margin:70px auto}.empty{padding:18px;text-align:center;color:var(--muted)}
@media(max-width:720px){.grid,.grid2{grid-template-columns:1fr}.rowtop{display:block}.header-inner{align-items:flex-start}.actions button{flex:1}}
</style>
</head>
<body>
<header>
 <div class="header-inner">
   <div><div class="brand"><span>RSA</span>inn Admin</div><div class="sub">Driftsands 108</div></div>
   <button id="logoutBtn" class="secondary hidden">Sign out</button>
 </div>
</header>

<main>
<section id="loginView" class="card login">
 <h2>Admin Sign In</h2>
 <p class="muted">Use one of the approved RSAinn administrator accounts.</p>
 <label>Email</label><input id="email" type="email" autocomplete="username">
 <label>Password</label><input id="password" type="password" autocomplete="current-password">
 <div class="actions"><button class="primary" id="loginBtn">Sign In</button></div>
 <div id="loginMsg"></div>
</section>

<section id="appView" class="hidden">
 <div class="tabs">
  <button class="tab active" data-tab="access">Cleaner Access</button>
  <button class="tab" data-tab="bookings">Bookings & Calendar</button>
 </div>

 <div id="accessTab">
  <div class="card">
   <h2>Generate Cleaner Access</h2>
   <label>Link label / name</label>
   <input id="accessLabel" placeholder="e.g. Debbie, Weekend Cleaner">
   <div class="grid" style="margin-top:14px">
    <button class="primary gen" data-days="2">2-Day Access</button>
    <button class="primary gen" data-days="7">7-Day Access</button>
    <button class="primary gen" data-days="">Permanent Access</button>
   </div>
   <div id="generatedBox" class="hidden">
    <div class="status"><strong>Cleaner access created</strong><div id="expiryText"></div></div>
    <div class="linkbox" id="generatedLink"></div>
    <div class="actions">
     <button class="secondary" id="copyGenerated">Copy Link</button>
     <button class="secondary" id="waGenerated">Share via WhatsApp</button>
    </div>
   </div>
   <div id="accessMsg"></div>
  </div>

  <div class="card">
   <div class="rowtop"><div><h2>Access Links</h2><div class="muted">Active, expired and revoked links.</div></div><button class="secondary small" id="refreshAccess">Refresh</button></div>
   <div id="accessList"></div>
  </div>
 </div>

 <div id="bookingsTab" class="hidden">
  <div class="card">
   <h2>Add Booking or Block Dates</h2>
   <div class="grid2">
    <div><label>Type</label><select id="newType"><option value="manual">Manual Booking</option><option value="blocked">Block Dates</option></select></div>
    <div><label>Guest / Reference</label><input id="newName" placeholder="Guest name or reason"></div>
    <div><label>Check-in / Start</label><input id="newIn" type="date"></div>
    <div><label>Check-out / End</label><input id="newOut" type="date"></div>
   </div>
   <label>Admin notes</label><textarea id="newNotes" rows="3" placeholder="Optional notes"></textarea>
   <div class="actions"><button class="primary" id="addBooking">Add to Calendar</button></div>
   <div id="bookingMsg"></div>
  </div>

  <div class="card">
   <div class="rowtop"><div><h2>Booking & Calendar Manager</h2><div class="muted">Synced, manual and blocked entries.</div></div><button class="secondary small" id="refreshBookings">Refresh</button></div>
   <div id="bookingList"></div>
  </div>
 </div>
</section>
</main>

<script>
const SUPABASE_URL = "https://bxjenexozkxqroidjvdw.supabase.co";
const SUPABASE_KEY = "sb_publishable_DGBXvfm1oJsje6rLO3veug_2Yn7uRx0";
const CLEANER_BASE = "https://rsainn108.github.io/rsainn-cleaner-portal/?access=";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let latestLink = "";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const fmt = d => d ? new Date(d).toLocaleString("en-ZA",{dateStyle:"medium",timeStyle:"short"}) : "Never expires";
function msg(el,text,bad=false){ el.innerHTML = `<div class="status ${bad?"error":""}">${esc(text)}</div>`; }

async function boot(){
 const {data:{session}} = await db.auth.getSession();
 if(session) showApp(); else showLogin();
}
function showLogin(){ $("loginView").classList.remove("hidden"); $("appView").classList.add("hidden"); $("logoutBtn").classList.add("hidden"); }
async function showApp(){
 $("loginView").classList.add("hidden"); $("appView").classList.remove("hidden"); $("logoutBtn").classList.remove("hidden");
 await Promise.all([loadAccess(),loadBookings()]);
}
$("loginBtn").onclick=async()=>{
 $("loginBtn").disabled=true;
 const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
 $("loginBtn").disabled=false;
 if(error) return msg($("loginMsg"),error.message,true);
 showApp();
};
$("logoutBtn").onclick=async()=>{await db.auth.signOut();showLogin();};

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active")); b.classList.add("active");
 $("accessTab").classList.toggle("hidden",b.dataset.tab!=="access");
 $("bookingsTab").classList.toggle("hidden",b.dataset.tab!=="bookings");
});

document.querySelectorAll(".gen").forEach(btn=>btn.onclick=async()=>{
 const days = btn.dataset.days === "" ? null : Number(btn.dataset.days);
 const label = $("accessLabel").value.trim() || (days ? `${days} Day Cleaner Access` : "Permanent Cleaner Access");
 btn.disabled=true;
 const {data,error}=await db.rpc("create_cleaner_access",{access_label:label,access_days:days});
 btn.disabled=false;
 if(error) return msg($("accessMsg"),error.message,true);
 const r=Array.isArray(data)?data[0]:data;
 latestLink=CLEANER_BASE+r.token;
 $("generatedLink").textContent=latestLink;
 $("expiryText").textContent=r.expires_at ? `Expires: ${fmt(r.expires_at)}` : "Permanent access — active until revoked";
 $("generatedBox").classList.remove("hidden");
 $("accessMsg").innerHTML="";
 loadAccess();
});
$("copyGenerated").onclick=()=>navigator.clipboard.writeText(latestLink);
$("waGenerated").onclick=()=>window.open("https://wa.me/?text="+encodeURIComponent("RSAinn Cleaner Portal access link:\n"+latestLink),"_blank");
$("refreshAccess").onclick=loadAccess;

async function loadAccess(){
 const {data,error}=await db.rpc("list_cleaner_access");
 if(error){$("accessList").innerHTML=`<div class="status error">${esc(error.message)}</div>`;return;}
 if(!data?.length){$("accessList").innerHTML='<div class="empty">No access links yet.</div>';return;}
 $("accessList").innerHTML=data.map(r=>{
   const expired=r.expires_at && new Date(r.expires_at)<new Date();
   const state=!r.active?"Revoked":expired?"Expired":"Active";
   const link=CLEANER_BASE+r.token;
   return `<div class="row">
    <div class="rowtop"><div><strong>${esc(r.label||"Cleaner Access")}</strong><br>
    <span class="pill ${state!=="Active"?"off":""}">${state}</span>
    <span class="muted"> · ${r.expires_at?`Expires ${esc(fmt(r.expires_at))}`:"Permanent"}</span></div>
    ${r.active?`<button class="danger small" onclick="revokeAccess(${r.id})">Revoke</button>`:""}
    </div>
    <div class="actions">
      <button class="secondary small" onclick='copyText(${JSON.stringify(link)})'>Copy Link</button>
      <button class="secondary small" onclick='shareWA(${JSON.stringify(link)})'>WhatsApp</button>
    </div></div>`;
 }).join("");
}
window.revokeAccess=async(id)=>{
 if(!confirm("Revoke this cleaner access link?")) return;
 const {error}=await db.rpc("revoke_cleaner_access",{access_id:id});
 if(error) return alert(error.message);
 loadAccess();
};
window.copyText=t=>navigator.clipboard.writeText(t);
window.shareWA=t=>window.open("https://wa.me/?text="+encodeURIComponent("RSAinn Cleaner Portal access link:\n"+t),"_blank");

$("addBooking").onclick=async()=>{
 const type=$("newType").value, name=$("newName").value.trim(), ci=$("newIn").value, co=$("newOut").value, notes=$("newNotes").value.trim();
 if(!ci||!co) return msg($("bookingMsg"),"Please select both dates.",true);
 const {data,error}=await db.rpc("admin_add_booking",{p_name:name,p_check_in:ci,p_check_out:co,p_booking_type:type,p_notes:notes||null});
 if(error) return msg($("bookingMsg"),error.message,true);
 msg($("bookingMsg"),`${type==="blocked"?"Blocked dates":"Manual booking"} added successfully.`);
 $("newName").value="";$("newIn").value="";$("newOut").value="";$("newNotes").value="";
 loadBookings();
};
$("refreshBookings").onclick=loadBookings;

async function loadBookings(){
 const {data,error}=await db.from("bookings").select("id,guest_name,check_in,check_out,source,booking_type,admin_notes,hidden,cleaning_status,ical_uid").order("check_in",{ascending:true});
 if(error){$("bookingList").innerHTML=`<div class="status error">${esc(error.message)}</div>`;return;}
 if(!data?.length){$("bookingList").innerHTML='<div class="empty">No bookings found.</div>';return;}
 $("bookingList").innerHTML=data.map(r=>`<div class="row" id="booking-${r.id}">
   <div class="rowtop"><div><strong>${esc(r.guest_name||"Unnamed")}</strong><br>
   <span class="pill ${esc(r.booking_type||"synced")}">${esc((r.booking_type||"synced").toUpperCase())}</span>
   ${r.hidden?'<span class="pill off">HIDDEN</span>':""}
   <span class="muted"> · ${esc(r.check_in)} → ${esc(r.check_out)}</span></div>
   <button class="secondary small" onclick="editBooking(${r.id})">Edit</button></div>
   ${r.admin_notes?`<div class="muted" style="margin-top:7px">${esc(r.admin_notes)}</div>`:""}
   <div id="edit-${r.id}" class="hidden"></div>
 </div>`).join("");
 window._bookings=data;
}
window.editBooking=id=>{
 const r=window._bookings.find(x=>x.id===id), box=$("edit-"+id);
 box.classList.remove("hidden");
 box.innerHTML=`<div class="grid2" style="margin-top:12px">
  <div><label>Guest / Reference</label><input id="eName-${id}" value="${esc(r.guest_name||"")}"></div>
  <div><label>Visibility</label><select id="eHidden-${id}"><option value="false" ${!r.hidden?"selected":""}>Visible</option><option value="true" ${r.hidden?"selected":""}>Hidden</option></select></div>
  <div><label>Check-in / Start</label><input id="eIn-${id}" type="date" value="${esc(r.check_in)}"></div>
  <div><label>Check-out / End</label><input id="eOut-${id}" type="date" value="${esc(r.check_out)}"></div>
 </div>
 <label>Admin notes</label><textarea id="eNotes-${id}" rows="2">${esc(r.admin_notes||"")}</textarea>
 <div class="actions"><button class="primary small" onclick="saveBooking(${id})">Save Changes</button><button class="secondary small" onclick='document.getElementById("edit-${id}").classList.add("hidden")'>Cancel</button>${(r.booking_type||"synced")==="synced"&&!r.hidden?`<button class="danger small" onclick="hideBooking(${id})">Hide Incorrect Sync</button>`:""}</div>`;
};
window.saveBooking=async id=>{
 const {error}=await db.rpc("admin_update_booking",{
  p_booking_id:id,p_name:$("eName-"+id).value,p_check_in:$("eIn-"+id).value,p_check_out:$("eOut-"+id).value,
  p_notes:$("eNotes-"+id).value||null,p_hidden:$("eHidden-"+id).value==="true"
 });
 if(error)return alert(error.message);
 await loadBookings();
};
window.hideBooking=async id=>{
 if(!confirm("Hide this synced booking from the cleaner portal?"))return;
 const r=window._bookings.find(x=>x.id===id);
 const {error}=await db.rpc("admin_update_booking",{p_booking_id:id,p_name:r.guest_name||"",p_check_in:r.check_in,p_check_out:r.check_out,p_notes:r.admin_notes||null,p_hidden:true});
 if(error)return alert(error.message);
 loadBookings();
};

db.auth.onAuthStateChange((_event,session)=>{ if(!session) showLogin(); });
boot();
</script>
</body>
</html>
